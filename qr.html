<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#131521">
  <title>나의 방 · QR 코드</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#131521;color:#f7f8fb;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
    main{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .card{width:min(92vw,560px);text-align:center}
    h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px);line-height:1.2}
    h1 span{display:block;margin-top:6px;font-size:clamp(14px,3vw,18px);font-weight:600;color:#b8c7eb;letter-spacing:.06em}
    .qr{display:block;width:min(78vw,420px);height:auto;margin:22px auto 18px;background:#fff;padding:14px;border-radius:14px;image-rendering:pixelated}
    p{margin:8px 0;font-size:clamp(16px,3.4vw,20px);line-height:1.6;color:#dfe7fb}
    .url{display:inline-block;margin-top:6px;padding:10px 16px;border:1px solid #6879b0;border-radius:10px;background:#10172e;color:#ffda35;font-size:clamp(15px,3.2vw,19px);word-break:break-all;text-decoration:none}
    .url:focus-visible,.back:focus-visible{outline:3px solid #ffda35;outline-offset:3px}
    .back{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:22px;padding:0 20px;border:1px solid #7182b4;border-radius:8px;background:#273658;color:#f7f8fb;font-size:16px;text-decoration:none}
    small{display:block;margin-top:18px;color:#8e9bc2;font-size:14px}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>나의 방<span>UNKNOWN RE:DRAW ROOM · 전병준</span></h1>
      <img class="qr" src="assets/QR_my-room.png" width="1640" height="1640" alt="나의 방으로 연결되는 QR 코드">
      <p>휴대폰 카메라로 비추면 나의 방이 열립니다.</p>
      <a class="url" href="https://minam20241740-bot.github.io/my-room/">https://minam20241740-bot.github.io/my-room/</a>
      <br><a class="back" href="./">나의 방으로 가기</a>
      <small>전시 기간에도 작품을 계속 고치며, 이 주소와 QR 코드는 바뀌지 않습니다.</small>
    </section>
  </main>
</body>
</html>
