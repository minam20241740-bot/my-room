<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><link rel="icon" type="image/png" href="../../assets/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAND CHAIN</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><p class="eyebrow">손동작 순서 게임</p><h1>HAND CHAIN<span>손동작 순서</span></h1><p class="intro">순서를 보고, 기억하고, 같은 기호를 눌러 기술을 완성하세요.</p></header>
  <section class="game" aria-label="HAND CHAIN 게임">
    <div class="topline"><p id="phase">준비</p><p id="step">3개의 기호</p></div>
    <fieldset id="techniques"><legend>도전할 기술</legend></fieldset>
    <div class="stage" aria-live="polite" aria-atomic="true"><div id="display" aria-hidden="true"></div><h2 id="message">첫빛을 완성해 보세요</h2><p id="detail">시작하면 기호 3개를 순서대로 보여드립니다.</p></div>
    <ol id="progress" aria-label="입력한 순서"></ol>
    <div id="symbols" aria-label="기호 입력"></div>
    <button id="start" class="primary" type="button">시작</button>
    <p class="keys">기호 입력 <kbd>1</kbd>–<kbd>6</kbd><span>다시 시작 <kbd>R</kbd></span></p>
    <p id="result" role="status"></p>
  </section>
  <footer>20241740 전병준 · 직접 만든 기호와 기술 이름을 사용하는 기억 게임</footer>
</main><script src="script.js"></script>
</body></html>
