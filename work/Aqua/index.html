display:block;height:100%;width:0;background:#8fe0e6;transition:width .25s}.aq-note{margin:0;padding:10px 14px;font-size:14px;color:#cfe6e9;text-align:center}@media(max-width:600px){.aqua-view canvas{aspect-ratio:4/5}.howto{text-align:left}}@media(prefers-reduced-motion:reduce){.aq-spin{animation-duration:3s}}</style></head><body>
<dialog open><header><h1>아쿠아의 클론(분신) MK2 · 책 감상</h1><button id="leave" type="button">작품으로 돌아가기</button></header><p>아쿠아의 본체처럼 클론(분신) 형식으로 만든 모델 MK2입니다. 책을 들어 표지를 보여 주는 모습을 돌려 볼 수 있어요.</p><div id="model"><div class="aqua-view" id="frame"><canvas id="cv" tabindex="0" aria-label="아쿠아 3D 모형. 끌어서 돌리거나 좌우 화살표 키로 돌릴 수 있습니다."></canvas><div class="aq-load" id="load" role="status" aria-live="polite"><div class="aq-spin" aria-hidden="true"></div><p id="load-text">모델을 불러오는 중입니다</p><div class="aq-bar" aria-hidden="true"><i id="load-bar"></i></div><small id="load-sub">파일이 커서(약 8MB) 처음에는 시간이 걸릴 수 있어요.</small></div></div><div class="work-links" id="views" role="group" aria-label="보는 방향"></div><p class="howto" id="howto"></p></div></dialog>
<script src="vendor/three-bundle.js"></script><script>
(function(){
var MODEL='Aqua_Female.glb';
var $=function(i){return document.getElementById(i)};
var cv=$('cv'),frame=$('frame'),load=$('load'),bar=$('load-bar'),ltext=$('load-text'),lsub=$('load-sub'),views=$('views');
var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
$('howto').textContent=(coarse?'손가락으로 화면을 좌우로 끌면 돌아갑니다.':'마우스를 누른 채 좌우로 끌면 돌아갑니다. 좌우 화살표 키도 쓸 수 있어요.')+' 아래 단추를 누르면 바로 그 방향으로 바뀝니다. 오른쪽·왼쪽은 아쿠아 기준입니다.';
$('leave').onclick=function(){if(parent===window)location.href=new URL('index.html',document.baseURI);else parent.postMessage({type:'room:return-detail'},location.origin==='null'?'*':location.origin)};
function still(msg){frame.textContent='';var im=new Image();im.src='assets/Aqua_Review.png';im.alt='아쿠아 작업 화면';frame.appendChild(im);var p=document.createElement('p');p.className='aq-note';p.textContent=msg;frame.appendChild(p);views.hidden=true}
var T=window.THREE,Loader=T&&(T.GLTFLoader||window.GLTFLoader),renderer;
if(!Loader){still('3D 화면을 열 수 없어 작업 화면 그림으로 보여 드립니다.');return}
try{renderer=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){still('이 기기에서는 3D 화면을 열 수 없어 작업 화면 그림으로 보여 드립니다.');return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
var stage=new T.Scene(),camera=new T.PerspectiveCamera(34,1.5,.035,25);camera.position.set(0,.18,4.14);camera.lookAt(0,-.035,0);
stage.add(new T.HemisphereLight('#e0f6ff','#897398',2.16));
var key=new T.DirectionalLight('#fff6db',2.65);key.castShadow=true;key.shadow.mapSize.set(512,512);Object.assign(key.shadow.camera,{left:-1.55,right:1.55,top:1.55,bottom:-1.55,near:.3,far:11});key.shadow.normalBias=.006;key.position.set(3,4,4);stage.add(key);
var pivot=new T.Group();stage.add(pivot);
var base=new T.Mesh(new T.CylinderGeometry(.51,.55,.08,64),new T.MeshStandardMaterial({color:'#2f676f',roughness:.71,metalness:.12}));base.position.y=-.98;base.receiveShadow=true;stage.add(base);
function resize(){var w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);window.addEventListener('resize',resize);resize();
/* 보는 방향: 아쿠아 기준 오른쪽·왼쪽 */
var PI=Math.PI,presets=[['정면',0],['오른쪽 옆',PI/2],['왼쪽 옆',-PI/2],['뒷면',PI]],btns=[],rot=0,goal=0,drag=false,auto=false;
function wrap(a){return((a%(2*PI))+3*PI)%(2*PI)-PI}
function setGoal(a){goal=rot+wrap(a-rot);auto=false;sync()}
function sync(){var r=wrap(rot);btns.forEach(function(b,i){var on=!auto&&Math.abs(wrap(r-presets[i][1]))<.09;b.setAttribute('aria-pressed',String(on))});if(autoBtn)autoBtn.setAttribute('aria-pressed',String(auto));cv.dataset.view=auto?'자동':(btns.filter(function(b){return b.getAttribute('aria-pressed')==='true'}).map(function(b){return b.textContent})[0]||'직접')}
var autoBtn=null;
presets.forEach(function(p){var b=document.createElement('button');b.type='button';b.textContent=p[0];b.setAttribute('aria-pressed','false');b.onclick=function(){setGoal(p[1])};views.appendChild(b);btns.push(b)});
autoBtn=document.createElement('button');autoBtn.type='button';autoBtn.textContent='천천히 돌리기';autoBtn.setAttribute('aria-pressed','false');autoBtn.onclick=function(){auto=!auto;goal=rot;sync()};views.appendChild(autoBtn);
var sx=0,sr=0;
cv.addEventListener('pointerdown',function(e){drag=true;auto=false;sx=e.clientX;sr=rot;goal=rot;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!drag)return;rot=sr+(e.clientX-sx)*.012;goal=rot;sync()});
function up(){drag=false;sync()}cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){goal=rot-.26;auto=false;e.preventDefault()}else if(e.key==='ArrowRight'){goal=rot+.26;auto=false;e.preventDefault()}});
/* 모델 불러오기(진행률 표시) */
var mixer=null,ready=false,last=performance.now();
function loop(now){var dt=Math.min(.1,(now-last)/1000);last=now;if(!drag){if(auto){rot+=dt*.7;goal=rot}else rot+=(goal-rot)*Math.min(1,dt*9)}pivot.rotation.y=rot;if(mixer)mixer.update(dt);renderer.render(stage,camera);if(!drag)sync()}
new Loader().loadAsync('assets/'+MODEL,function(e){if(e&&e.lengthComputable&&e.total){var p=Math.min(99,Math.round(e.loaded/e.total*100));bar.style.width=p+'%';ltext.textContent='모델을 불러오는 중입니다 '+p+'%'}}).then(function(g){
 var scene=g.scene;ltext.textContent='화면을 준비하는 중입니다';
 if(g.animations&&g.animations.length){mixer=new T.AnimationMixer(scene);g.animations.forEach(function(c){mixer.clipAction(c).play()});mixer.setTime(2.8)}
 scene.updateMatrixWorld(true);
 var box=new T.Box3().setFromObject(scene),scale=1.88/box.getSize(new T.Vector3()).y;scene.scale.multiplyScalar(scale);scene.position.sub(box.getCenter(new T.Vector3()).multiplyScalar(scale));
 scene.traverse(function(o){if(o.isMesh)o.castShadow=true});pivot.add(scene);
 cv.dataset.model='ready';ready=true;load.classList.add('done');setTimeout(function(){load.remove()},700);
 renderer.setAnimationLoop(loop);sync();
}).catch(function(err){console.error(err);still('모델을 불러오지 못해 작업 화면 그림으로 보여 드립니다. 인터넷 연결을 확인하고 다시 열어 주세요.')});
})();
</script></body></html>
