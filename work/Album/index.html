<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><link rel="icon" type="image/png" href="../../assets/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKMU DINOSAUR · 앨범 재생</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071235;color:#fff;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 30% 20%,#17358f,#071235 70%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.wrap{display:grid;grid-template-columns:minmax(300px,520px) minmax(300px,440px);gap:56px;align-items:center;max-width:1100px;width:100%}
.deck{position:relative;aspect-ratio:1.15/1}
.disc{position:absolute;top:6%;left:26%;width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#e8c76a 0 15%,#111 16% 19%,#1d1d1d 20% 31%,#0d0d0d 32% 44%,#1b1b1b 45% 56%,#0a0a0a 57%);box-shadow:0 18px 40px rgba(0,0,0,.55);transition:transform 1s cubic-bezier(.2,.8,.2,1);transform:translateX(0)}
.playing .disc{transform:translateX(14%);animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:translateX(14%) rotate(360deg)}}
.sleeve{position:absolute;left:0;top:0;width:74%;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 22px 46px rgba(0,0,0,.6);z-index:2;background:#000}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.info h1{margin:0;font-size:44px;line-height:1.1;letter-spacing:-.02em}.info h1 span{display:block;font-size:20px;font-weight:600;color:#9bb7ff;margin-bottom:8px;letter-spacing:.14em}
.info p{color:#c5d2f5;line-height:1.7;margin:14px 0 22px}
.tracks{display:grid;gap:10px}
.tr{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.tr.on{background:#2f5fd8;border-color:#7fa2ff}
.tr b{font-size:18px}.tr small{display:block;color:#c5d2f5;font-size:15px;margin-top:2px}.tr i{margin-left:auto;font-style:normal;font-size:22px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;margin-left:auto}.eq u{width:4px;background:#fff;border-radius:2px;height:6px;text-decoration:none}
.playing .tr.on .eq u{animation:eq .6s ease-in-out infinite alternate}.eq u:nth-child(2){animation-delay:.15s!important}.eq u:nth-child(3){animation-delay:.3s!important}.eq u:nth-child(4){animation-delay:.08s!important}
@keyframes eq{from{height:5px}to{height:22px}}
.ctl{display:flex;align-items:center;gap:14px;margin-top:20px}
.pp{width:64px;height:64px;border-radius:50%;border:0;background:#fff;color:#071235;font-size:26px;font-weight:900;cursor:pointer}
.bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}.bar div{height:100%;width:0;background:#7fa2ff}
.note{margin-top:18px;padding:12px 14px;border-left:3px solid #7fa2ff;background:rgba(255,255,255,.07);border-radius:0 8px 8px 0;font-size:15px;line-height:1.6;color:#dbe6ff}.note b{color:#fff}.info p,.note,.tr small{word-break:keep-all}
.sleeve.loading::after{content:'불러오는 중…';position:absolute;inset:0;display:grid;place-items:center;background:#0a1a4d;color:#9bb7ff;font-size:15px}
@media(max-width:820px){.wrap{grid-template-columns:1fr;gap:28px}}
</style></head><body>
<div class="wrap" id="app">
 <div class="deck"><div class="disc"></div><div class="sleeve loading" id="sleeve"><img src="../Gallery/p_akmu.jpg" alt="AKMU DINOSAUR 앨범 표지"></div></div>
 <div class="info">
  <h1><span>AKMU</span>DINOSAUR</h1>
  <p>새로 디자인한 앨범 표지입니다. ▶를 누르면 LP가 슬리브에서 나와 돌아가고 소리가 납니다. A면·B면을 눌러 소리를 바꿔 보세요.</p>
  <div class="tracks" id="tracks"></div>
  <div class="ctl"><button class="pp" id="pp" aria-label="재생">▶</button><div class="bar"><div id="pg"></div></div></div>
  <div class="note"><b>실제 곡이 아닙니다.</b> 지금 나오는 소리는 재생 화면을 보여 주려고 직접 만든 임시 데모 소리입니다. 소리가 안 나면 휴대폰의 무음 스위치와 음량을 확인해 주세요.</div>
 </div>
</div>
<script>
const T=[{n:'A면 · 데모 소리 1',s:'빠른 박자 · 직접 만든 임시 소리',bpm:100,root:55,scale:[0,3,5,7,10],pat:[1,0,0,1,0,1,0,0]},{n:'B면 · 데모 소리 2',s:'느린 박자 · 직접 만든 임시 소리',bpm:72,root:49,scale:[0,2,7,9,12],pat:[1,0,0,0,1,0,0,0]}];
let cur=0,playing=false,ctx,timer,step=0,t0=0,len=0;
const $=id=>document.getElementById(id),app=$('app');
T.forEach((t,i)=>{const b=document.createElement('button');b.className='tr'+(i===0?' on':'');b.innerHTML='<div><b>'+t.n+'</b><small>'+t.s+'</small></div><div class="eq"><u></u><u></u><u></u><u></u></div>';b.onclick=()=>{cur=i;document.querySelectorAll('.tr').forEach((x,j)=>x.classList.toggle('on',j===i));if(playing){stop();play()}};$('tracks').appendChild(b)});
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(f,time,dur,type,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(vol,time+.02);g.gain.exponentialRampToValueAtTime(.0001,time+dur);o.connect(g).connect(ctx.destination);o.start(time);o.stop(time+dur+.05)}
function tick(){const t=T[cur],sp=60/t.bpm/2;while(next<ctx.currentTime+.2){const k=step%16;
 if(t.pat[k%8])tone(hz(t.root),next,sp*1.6,'sine',.5);
 if(k%2===0&&(step%3!==2))tone(hz(t.root+12+t.scale[(step*3)%t.scale.length]),next,sp*1.4,cur?'triangle':'square',cur?.12:.06);
 if(k%4===0)tone(hz(t.root+24+t.scale[(step>>2)%t.scale.length]),next,sp*3,'sine',.06);
 next+=sp;step++}
 const e=(ctx.currentTime-t0)%16;$('pg').style.width=(e/16*100)+'%'}
let next=0;
(function(){var sl=$('sleeve'),im=sl.querySelector('img'),done=function(){sl.classList.remove('loading')};if(im.complete)done();else{im.addEventListener('load',done);im.addEventListener('error',done)}})();
function play(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();step=0;next=ctx.currentTime+.05;t0=ctx.currentTime;timer=setInterval(tick,50);playing=true;app.classList.add('playing');$('pp').textContent='❚❚';$('pp').setAttribute('aria-label','멈춤')}
function stop(){clearInterval(timer);playing=false;app.classList.remove('playing');$('pp').textContent='▶';$('pp').setAttribute('aria-label','재생')}
$('pp').onclick=()=>playing?stop():play();
if(new URLSearchParams(location.search).get('play')==='1'){app.classList.add('playing');$('pg').style.width='38%';$('pp').textContent='❚❚'}
</script></body></html>
